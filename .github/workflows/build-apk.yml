name: GG CARAMELO - gerar APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "GG_Caramelo_Projeto_Base_v0.1.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Extrair projeto Android
        run: |
          mkdir -p source
          unzip -q GG_Caramelo_Projeto_Base_v0.1.zip -d source
          find source -maxdepth 3 -type f | head -80
          test -f source/ggcm_review/app/build.gradle

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de teste
        working-directory: source/ggcm_review
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-CARAMELO-APK
          path: source/ggcm_review/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

